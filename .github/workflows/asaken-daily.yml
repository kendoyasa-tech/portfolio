# asaken(@ninjacode482651)用 毎日のサービス紹介
# 毎日 朝6時ごろ・昼11時ごろ(日本時間)の2回、ポートフォリオのサービス紹介文を1つ選んで Discord に送る。
# Discord には「Xに投稿する」リンクも付くので、タップして投稿する(X API は有料のため使わない)。
# GitHub の定時実行は6〜10時間遅れることがあったため使わず、Claude の定期タスクが
# 決まった時刻にこのワークフローを起動する(slot に morning / noon を渡す)。
# 専用の送り先(ASAKEN_DISCORD_WEBHOOK_URL)が未登録なら、姫辯と同じ送り先(DISCORD_WEBHOOK_URL)に送る。

name: asaken 毎日のサービス紹介
run-name: asaken ${{ inputs.slot || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "morning(朝)か noon(昼)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

# 同じ枠(朝・昼)が続けて起動されても1回しか送らない
concurrency:
  group: asaken-${{ inputs.slot }}
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: 同じ枠を3時間以内に送っていたらやめる
        id: dup
        if: ${{ inputs.slot != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/asaken-daily.yml/runs?status=success&created=>=$since" \
            --jq '[.workflow_runs[] | select(.display_title == "asaken ${{ inputs.slot }}" and .id != ${{ github.run_id }})] | length')
          echo "skip=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          [ "$n" -gt 0 ] && echo "この枠はもう送ってあるので省略します。" || true

      - uses: actions/checkout@v4
        if: steps.dup.outputs.skip != 'true'

      - uses: actions/setup-node@v4
        if: steps.dup.outputs.skip != 'true'
        with:
          node-version: "22"

      - name: 今日のサービス紹介を Discord に送る
        if: steps.dup.outputs.skip != 'true'
        env:
          ASAKEN_DISCORD_WEBHOOK_URL: ${{ secrets.ASAKEN_DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_URL }}
          SLOT: ${{ inputs.slot }}
          ASAKEN_X_API_KEY: ${{ secrets.ASAKEN_X_API_KEY }}
          ASAKEN_X_API_SECRET: ${{ secrets.ASAKEN_X_API_SECRET }}
          ASAKEN_X_ACCESS_TOKEN: ${{ secrets.ASAKEN_X_ACCESS_TOKEN }}
          ASAKEN_X_ACCESS_TOKEN_SECRET: ${{ secrets.ASAKEN_X_ACCESS_TOKEN_SECRET }}
        run: node scripts/asaken-daily.mjs
