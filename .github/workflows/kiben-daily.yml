# 姫辯学園琴丘 毎朝の自動試合
# 毎朝6時(日本時間)ごろに1試合進め、結果をDiscordの #姫辯スポーツ とXに投稿し、
# works/kiben/data/season.json を更新してポートフォリオに反映する。
# GitHub の定時実行は3〜5時間遅れていたため使わず、Claude の定期タスクが毎朝5時54分にこのワークフローを起動する。
# 同じ日に2回起動されても、試合は1日1回だけ(scripts/kiben-daily.mjs で判定)。

name: 姫辯 毎朝の自動試合

on:
  workflow_dispatch:         # Actions タブから手動でも実行できる
    inputs:
      repost:
        description: "試合をせず、最新の試合を投稿し直す(投稿テスト用)"
        type: boolean
        default: false
      target:
        description: "投稿し直す先(投稿し直すときだけ使う)"
        type: choice
        options: [両方, Discordだけ, Xだけ]
        default: 両方

permissions:
  contents: write

concurrency:
  group: kiben-daily
  cancel-in-progress: false

jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 試合をして Discord と X に投稿
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: >-
          node scripts/kiben-daily.mjs
          ${{ inputs.repost && '--repost' || '' }}
          ${{ inputs.repost && inputs.target == 'Discordだけ' && '--discord-only' || '' }}
          ${{ inputs.repost && inputs.target == 'Xだけ' && '--x-only' || '' }}

      - name: 結果を保存
        run: |
          git config user.name "kiben-sports-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works/kiben/data/season.json
          git diff --cached --quiet && exit 0
          git commit -m "姫辯スポーツ $(TZ=Asia/Tokyo date +%Y-%m-%d) の試合結果"
          git push
